[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitles-extractor"
version = "3.23.666"
description = "Subtitle Studio — trích xuất, dịch, lồng tiếng và xuất bản phụ đề video (Clean Architecture)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Subtitles Extractor Team" }]
keywords = ["subtitles", "ocr", "paddleocr", "video", "vietnamese"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing",
]
dependencies = [
    # [v3.23.619] Đồng bộ với requirements.txt — trước đây thiếu 10 gói ứng dụng import
    # (av, rapidfuzz, google-genai, scipy, librosa…) nên `pip install .` ra bản thiếu chức
    # năng. Gói GPL (edge-tts, pedalboard, whisperx…) CỐ Ý không có ở đây — xem
    # docs/LICENSE_ANALYSIS.md và requirements-gpu.txt.
    # GUI
    "PySide6>=6.6",  # LGPL v3 — an toàn thương mại (thay PyQt6 GPL)
    # OCR
    "paddlepaddle>=3.0",
    # [v3.23.595] PP-OCRv6 (model mặc định) chỉ có từ PaddleOCR 3.7.0.
    "paddleocr>=3.7.0",
    # Video / ảnh / âm thanh
    "python-mpv>=1.0",
    "opencv-python>=4.9",
    "numpy>=1.24",
    "soundfile>=0.12",
    "Pillow>=10.0",  # giải mã phụ đề ảnh PGS/VobSub
    "av>=12.0",
    "scipy>=1.11",
    "librosa>=0.10",  # time-stretch giữ cao độ (ISC, thay pedalboard GPL)
    "pydub>=0.25",
    "pyloudnorm>=0.1",
    # Settings
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    # Logging (v2.29) — Plug & Play, thread-safe, auto color
    "loguru>=0.7.0",
    # Văn bản
    "rapidfuzz>=3.0",
    "charset-normalizer>=3.0",  # thay chardet LGPL
    "rjieba>=0.1.11",  # tách từ tiếng Trung cho STT
    # Dịch / TTS Gemini
    "google-genai>=2.29,<3",
    # Sửa JSON hỏng từ LLM (v3.23.143)
    "json-repair>=0.39",
    # [v3.23.607] Dữ liệu múi giờ cho zoneinfo trên Windows (mốc đổi ngày hạn mức Gemini).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
stt = [
    # Trích phụ đề từ âm thanh (WhisperX) — chạy ở tiến trình con để cô lập khỏi
    # paddle (tránh xung đột cuDNN/cuBLAS DLL). Cần torch khớp CUDA của máy.
    "whisperx>=3.1",
]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.4",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.8",
]

[project.scripts]
subtitles-extractor = "subtitles_extractor.composition.bootstrap:bootstrap_for_gui"

[project.gui-scripts]
subtitles-extractor-gui = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"subtitles_extractor" = ["data/*.json", "data/*.txt"]

# ── Code quality ──────────────────────────────────────────────────────────

[tool.black]
line-length = 90
target-version = ["py311"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "SIM",           # flake8-simplify
    "RUF",           # ruff-specific
]
ignore = [
    "B008",  # Do not perform function call in argument defaults (cho pydantic Field)
    "N818",  # Exception name should end with Error (đã đặt đúng nhưng có vài alias)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # cho phép assert trong tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["paddleocr.*", "paddle.*", "cv2.*", "PySide6.*", "shiboken6.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: chậm — bỏ qua khi không có flag --runslow",
    "gpu: yêu cầu GPU",
    "qt: cần PySide6",
]
